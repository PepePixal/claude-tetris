<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
        </div>

        <div class="panel-section hidden" id="hold-panel">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section hidden" id="queue-panel">
          <span class="label">COLA</span>
          <canvas id="queue-canvas" width="90" height="450"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>C</kbd> hold</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="ability-overlay" class="overlay hidden">
      <div class="overlay-box ability-box">
        <p class="ability-title">ELEGÍ UNA HABILIDAD</p>
        <ul class="ability-list">
          <li><button class="ability-btn" data-ability="1"><kbd>1</kbd> Ver siguientes 5 piezas</button></li>
          <li><button class="ability-btn" data-ability="2"><kbd>2</kbd> Cambiar pieza actual</button></li>
          <li><button class="ability-btn" data-ability="3"><kbd>3</kbd> Ralentizar tiempo (10s)</button></li>
          <li><button class="ability-btn" data-ability="4"><kbd>4</kbd> Deshacer última colocación</button></li>
          <li><button class="ability-btn" data-ability="5"><kbd>5</kbd> Reservar pieza (hold)</button></li>
        </ul>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
